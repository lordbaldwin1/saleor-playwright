name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  playwright:
    name: Playwright (API + Dashboard + Storefront)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clone Saleor platform
        run: git clone --depth 1 https://github.com/saleor/saleor-platform.git saleor-platform

      - name: Clone Saleor storefront
        run: git clone --depth 1 https://github.com/saleor/storefront.git storefront

      - name: Configure storefront for local Saleor
        run: npm run storefront:configure

      - name: Cache storefront pnpm dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml

      - name: Install storefront dependencies
        run: cd storefront && pnpm install --frozen-lockfile

      - name: Initialize Saleor (migrate + sample data)
        run: npm run saleor:init

      - name: Start Saleor platform
        run: npm run saleor:up:detached

      - name: Wait for API and Dashboard
        run: bash scripts/wait-for-services.sh

      - name: Start storefront dev server
        run: bash scripts/start-storefront-ci.sh

      - name: Wait for storefront
        run: WAIT_STOREFRONT=1 bash scripts/wait-for-services.sh
        env:
          MAX_ATTEMPTS: 72

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload storefront dev log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-dev-log
          path: storefront-dev.log
          retention-days: 3
